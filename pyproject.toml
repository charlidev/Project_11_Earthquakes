
# ============================================================
# PROJECT METADATA
# ============================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-intelligence-lakehouse"
version = "0.1.0"
description = "End-to-end Data Engineering project using USGS earthquake data and Azure Databricks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "charlidev" }
]

# Runtime dependencies
dependencies = [
    "requests>=2.31,<3.0",
    "pandas>=2.1,<3.0",
    "PyYAML>=6.0,<7.0"
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0"
]

# ============================================================
# PACKAGE DISCOVERY
# ============================================================

[tool.setuptools.packages.find]
where = ["src"]
include = ["seismic_intelligence*"]

# ============================================================
# PYTEST CONFIGURATION
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

markers = [
    "integration: tests requiring external services or infrastructure"
]

# ============================================================
# RUFF - CODE QUALITY AND FORMATTING
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
